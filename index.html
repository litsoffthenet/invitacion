.hint{position:fixed;top:calc(env(safe-area-inset-top,0px) + 20px);left:0;right:0;text-align:center;
  font-size:clamp(1.15rem,4.8vw,1.6rem);font-weight:600;padding:0 16px;font-style:italic;color:#fff;text-shadow:0 0 8px rgba(0,0,0,.9),0 0 18px rgba(122,16,32,.8);animation:hintPulse 2s ease-in-out infinite;transition:opacity .5s;z-index:2}
@keyframes hintPulse{0%,100%{opacity:.75}50%{opacity:1}}
.cracked .hint{opacity:0;animation:none}

.scene{position:relative;width:var(--w);transition:transform 1s cubic-bezier(.4,0,.2,1)}
.scene.rise{transform:translateY(calc(var(--w)*.21))}
.env{position:relative;width:100%;aspect-ratio:781/782;perspective:1000px;animation:float 3.6s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-5px)}}
.cracked .env{animation:jolt .5s linear}
.open .env,.rise .env{animation:none}

@keyframes flap{
  0%{transform:rotateX(-180deg) scaleY(1.438);z-index:7}
  49%{z-index:7}
  50%{transform:rotateX(-90deg) scaleY(1.219);z-index:2}
  100%{transform:rotateX(0) scaleY(1);z-index:2}}

/* Sello de lacre */
.seal{position:absolute;left:50.20%;top:64.07%;width:21%;aspect-ratio:1.0448;margin:-10.05% 0 0 -10.5%;z-index:8;
  animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.05)}}
.cracked .seal{animation:none}
.half{position:absolute;inset:0;background:var(--sl) center/100% 100% no-repeat;filter:drop-shadow(0 4px 6px rgba(0,0,0,.6))}
.half.l{clip-path:polygon(0 0,52% 0,45% 25%,56% 50%,46% 75%,52% 100%,0 100%)}
.half.r{clip-path:polygon(52% 0,100% 0,100% 100%,52% 100%,46% 75%,56% 50%,45% 25%)}
.cracked .half.l{animation:fallL 1s cubic-bezier(.5,0,.9,.6) forwards}
.cracked .half.r{animation:fallR 1s cubic-bezier(.5,0,.9,.6) forwards}
@keyframes fallL{20%{transform:translate(-6px,2px) rotate(-8deg)}100%{transform:translate(-40px,150px) rotate(-55deg);opacity:0}}
@keyframes fallR{20%{transform:translate(6px,2px) rotate(8deg)}100%{transform:translate(44px,170px) rotate(60deg);opacity:0}}

/* Papel que sube del sobre */
.paperbox{position:absolute;left:0;width:100%;top:calc(var(--w)*-.5);height:calc(var(--w)*1.4834);overflow:hidden;z-index:3;pointer-events:none}
.paper{position:absolute;left:calc(var(--w)*(0.5006 - 0.8297/2));width:calc(var(--w)*0.8297);
  top:calc(var(--w)*0.08);height:calc(var(--w)*.95);
  transform:translateY(calc(var(--w)*1.0948));transition:transform 1.5s cubic-bezier(.3,.8,.3,1);
  background:linear-gradient(180deg,rgba(0,0,0,.12),transparent 8%),
    repeating-linear-gradient(0deg,rgba(0,0,0,.02) 0 1px,transparent 1px 3px),
    repeating-linear-gradient(90deg,rgba(0,0,0,.02) 0 1px,transparent 1px 3px),rgb(236,233,228);
  box-shadow:0 0 14px rgba(0,0,0,.35)}
.rise .paper{transform:none}
.paper::before{content:"";position:absolute;left:3%;right:3%;top:3%;height:calc(var(--w)*.76);border:1.5px dotted #bfb8a6;border-radius:2px}
.content{position:absolute;left:0;right:0;top:0;height:calc(var(--w)*.8);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:.4em;padding:0 11%;text-align:center;color:var(--ink);
  font-size:calc(var(--w)*.042);line-height:1.2;opacity:0;transition:opacity .6s}
.fin .content{opacity:1}
.content>svg.bat{width:2em;color:var(--wine)}
.content h1{font:400 1.8em/1 "Pirata One",Georgia,serif;color:var(--wine);margin:0}
.content .rule{width:55%;height:2px;opacity:.45;background:repeating-linear-gradient(90deg,var(--ink) 0 6px,transparent 6px 10px)}
.content p{margin:0;font-weight:500}
.content b{color:var(--wine);font-weight:700}
.content .party{font-style:italic;font-weight:700;font-size:1.02em;color:var(--wine);margin-top:.15em}


/* Sangre (foto) */
.bloodk,.bloodp{position:absolute;inset:0;background:var(--spl) 50% 55%/100% auto no-repeat;mix-blend-mode:multiply;pointer-events:none}
.bloodk{-webkit-mask-image:var(--pk);mask-image:var(--pk);-webkit-mask-size:100% 100%;mask-size:100% 100%}
.bloodp{background-position:50% 20%;-webkit-mask-image:radial-gradient(ellipse 62% 58% at 50% 50%,transparent 0,transparent 72%,rgba(0,0,0,.55) 100%);
  mask-image:radial-gradient(ellipse 62% 58% at 50% 50%,transparent 0,transparent 72%,rgba(0,0,0,.55) 100%)}
.paper{transition:transform 1.5s cubic-bezier(.3,.8,.3,1),box-shadow 1.5s}
.rise .paper{box-shadow:0 0 46px rgba(255,122,26,.3),0 0 14px rgba(0,0,0,.35)}

/* Ambiente */
.scene{z-index:1}
.fbat{position:fixed;left:0;top:var(--t);width:32px;color:#0a0808;opacity:.85;pointer-events:none;z-index:0;
  transform:translateX(-60px);animation:cross var(--s) linear var(--dl) infinite}
.fbat svg{display:block;width:100%;animation:bflap .24s ease-in-out infinite alternate}
@keyframes bflap{to{transform:scaleY(.45)}}
@keyframes cross{0%{transform:translate(-60px,0)}25%{transform:translate(27vw,-22px)}50%{transform:translate(54vw,12px)}
  75%{transform:translate(81vw,-16px)}100%{transform:translate(calc(100vw + 60px),6px)}}
.spider{position:fixed;top:0;right:11vw;width:1px;height:19vh;background:rgba(255,255,255,.4);z-index:2;pointer-events:none;
  transform:translateY(-105%);transition:transform 2.8s ease-in-out .5s}
.fin .spider{transform:none}
.spider svg{position:absolute;left:-13px;bottom:-24px;width:26px;animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(7px) rotate(4deg)}}

.tap{position:absolute;inset:-4%;z-index:10;background:transparent;border:0;cursor:pointer;border-radius:8px;-webkit-tap-highlight-color:transparent}
.tap:focus-visible{outline:3px solid #ff7a1a;outline-offset:4px}
.cracked .tap{pointer-events:none}
.again{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);left:50%;transform:translateX(-50%);
  background:rgba(0,0,0,.35);color:#d8d4cb;border:1px solid #6b6962;border-radius:999px;padding:8px 18px;
  font:inherit;font-size:1.05rem;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .5s;z-index:20}
.again:focus-visible{outline:3px solid #ff7a1a;outline-offset:3px}
.fin .again{opacity:1;pointer-events:auto;transition-delay:1.2s}
.noanim *{transition:none!important;animation:none!important}
@media (max-height:520px){
  :root{--w:min(88vw,520px,calc((100vh - 105px)/1.541));--w:min(88vw,520px,calc((100dvh - 105px)/1.541))}
  .hint{top:calc(env(safe-area-inset-top,0px) + 8px);font-size:1rem}
}
@media (max-width:360px){.again{font-size:.95rem;padding:7px 14px}}
@media (prefers-reduced-motion:reduce){
  .env,.seal,.cracked .env{animation:none}
  .open .flap,.cracked .half{animation-duration:.01s}
  .paper,.scene{transition-duration:.01s}
  .fbat,.spider svg,.dp,.drip i{animation:none}
  .fbat{display:none}
  .dr{height:var(--l)}
}
</style>
</head>
<body>
<div class="fbat" style="--t:16vh;--s:17s;--dl:1s"></div>
<div class="fbat" style="--t:62vh;--s:23s;--dl:7s;width:24px"></div>
<div class="fbat" style="--t:34vh;--s:29s;--dl:13s;width:28px"></div>
<div class="spider" aria-hidden="true"><svg viewBox="0 0 24 24"><g fill="none" stroke="#0b0909" stroke-width="1.2" stroke-linecap="round"><path d="M9 11L3 6L1 9M9 13L2 12L1 16M9 15L3 19L2 23M10 17L7 23M15 11L21 6L23 9M15 13L22 12L23 16M15 15L21 19L22 23M14 17L17 23"/></g><ellipse cx="12" cy="15" rx="4.2" ry="5.2" fill="#0b0909"/><circle cx="12" cy="8.600" r="2.800" fill="#0b0909"/><circle cx="11" cy="8.200" r=".7" fill="#d4122d"/><circle cx="13" cy="8.200" r=".7" fill="#d4122d"/></svg></div>

<div class="scene" id="scene">

    <div class="layer back"></div>
    <div class="paperbox"><div class="paper"><div class="bloodp"></div><div class="content">
      <svg class="bat" viewBox="-26 -10 52 22" aria-hidden="true"><path fill="currentColor" d="M0 0C-6-6-16-6-24 2c6-2 10 0 12 4 4-3 8-3 12 2 4-5 8-5 12-2 2-4 6-6 12-4C16-6 6-6 0z"/></svg>
      <h1>Quedas invitade a nuestra previa de Halloween</h1>
      <div class="rule"></div>
      <p>Te esperamos en <b>Avenida Navarra 37, 3º Derecha Exterior</b>.</p>
      <p class="date"><b>31/10/26</b> a partir de las <b>23:00h</b></p>
      <p>Sin disfraz no se podrá entrar.</p>
      <p class="party">Trae tu bebida y tus ganas de fiesta: el DJ ya está de nuestra parte.</p>

</div>
<button class="again" id="again" type="button">Cerrar el sobre</button>
<script>

  var scene=document.getElementById('scene'), seal=document.getElementById('seal'),
      tap=document.getElementById('tap'), again=document.getElementById('again'),
      root=document.body, timers=[];

  function web(){var a=[0,22.5,45,67.5,90].map(function(x){return x*Math.PI/180}),d='';
    a.forEach(function(t){d+='M0 0L'+Math.cos(t)*100+' '+Math.sin(t)*100});
    [22,40,58,76,94].forEach(function(r){for(var i=0;i<4;i++){var t1=a[i],t2=a[i+1],tm=(t1+t2)/2,rc=r*.8;
      d+='M'+Math.cos(t1)*r+' '+Math.sin(t1)*r+'Q'+Math.cos(tm)*rc+' '+Math.sin(tm)*rc+' '+Math.cos(t2)*r+' '+Math.sin(t2)*r}});return d}
  document.querySelectorAll('.web path').forEach(function(p){p.setAttribute('d',web())});
  document.querySelectorAll('.fbat').forEach(function(b){b.innerHTML=BAT});
  function at(ms,fn){timers.push(setTimeout(fn,ms))}
  function setState(c){scene.className='scene '+c; root.className=c}
  tap.addEventListener('click',function(){
    setState('cracked');
    if(navigator.vibrate){try{navigator.vibrate([40,30,80])}catch(e){}}
    at(550,function(){setState('cracked open')});
    at(1500,function(){setState('cracked open rise')});
    at(2900,function(){setState('cracked open rise fin'); tap.hidden=true});
  });
  again.addEventListener('click',function(){
    timers.forEach(clearTimeout); timers=[];
    root.className='noanim'; scene.className='scene noanim';
    void scene.offsetWidth;
    setState(''); tap.hidden=false;
  });
})();
</script>
</body>
</html>
